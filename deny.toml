# cargo-deny configuration: security advisories, licenses, banned crates, sources.
# Run locally with `cargo deny check`; CI runs it in the PR-to-main gate and weekly.

[graph]
all-features = true                  # check every feature combination we ship (web, desktop, mobile, server)

# ---------------------------------------------------------------------------
# Security advisories (RustSec)
# ---------------------------------------------------------------------------
[advisories]
# Fail on unmaintained crates we depend on directly. Transitive ones (e.g. paste,
# proc-macro-error, fxhash inside Dioxus) can't be fixed here and would block every PR;
# vulnerabilities still fail regardless of depth.
unmaintained = "workspace"
yanked = "deny"
# Every ignore needs a comment saying why it's acceptable and when to revisit it.
ignore = []

# ---------------------------------------------------------------------------
# Licenses: must be compatible with shipping under MIT OR Apache-2.0
# ---------------------------------------------------------------------------
[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "NCSA",
    "CDLA-Permissive-2.0",           # webpki-roots (Mozilla's CA certificate data)
    "MPL-2.0",                       # weak file-level copyleft, pulled in by Dioxus; see decisions.md #020
]

# ---------------------------------------------------------------------------
# Banned and duplicate crates
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"           # Dioxus pulls in some duplicates; visible but not blocking
wildcards = "deny"                   # no `version = "*"` dependencies
allow-wildcard-paths = true          # internal path dependencies are fine

# ---------------------------------------------------------------------------
# Sources: crates.io only
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
