# Clippy configuration (thresholds and test exemptions).
# Lint levels themselves live in the workspace Cargo.toml.

allow-unwrap-in-tests = true        # unwrap()/expect() are fine inside #[test] code
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

too-many-lines-threshold = 80        # functions longer than this should be split
cognitive-complexity-threshold = 15  # deeply nested/branchy functions get flagged

# Proper nouns that doc_markdown would otherwise demand backticks around.
# ".." keeps clippy's built-in list.
doc-valid-idents = ["SQLite", ".."]
