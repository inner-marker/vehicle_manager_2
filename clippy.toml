# Clippy configuration (thresholds and test exemptions).
# Lint levels themselves live in the workspace Cargo.toml.

allow-unwrap-in-tests = true        # unwrap()/expect() are fine inside #[test] code
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

too-many-lines-threshold = 80        # functions longer than this should be split
# Deeply nested/branchy functions get flagged. 30, not 15: sqlx turns on tracing's `log`
# feature, and every tracing macro then adds about 2 to the score, so 15 failed
# ordinary functions with two log calls (phase-2.md step 1c; agreed with the human).
cognitive-complexity-threshold = 30

# Proper nouns that doc_markdown would otherwise demand backticks around.
# ".." keeps clippy's built-in list.
doc-valid-idents = ["SQLite", ".."]
