# Workspace root. Member crates opt into the shared lint set with:
#
#   [lints]
#   workspace = true

[workspace]
resolver = "3"                           # Rust 2024 edition resolver
# Dependencies flow one way: domain <- storage <- server <- app
members = [
    "crates/domain",   # pure logic; no I/O; compiles to WASM
    "crates/storage",  # SQLite/sqlx, migrations, row <-> domain conversion; native only
    "crates/server",   # sync engine, auth, integrity, admin ops (library); native only
    "crates/app",      # Dioxus UI (web/desktop/mobile) + thin server functions
]

[workspace.package]
version = "0.1.0"               # single source of truth for the app version; release tags must match (vX.Y.Z)
edition = "2024"
license = "MIT OR Apache-2.0"   # standard Rust dual license; crates inherit with `license.workspace = true`
rust-version = "1.95"           # matches rust-toolchain.toml

# ---------------------------------------------------------------------------
# Shared dependency versions. Crates opt in with `name.workspace = true`.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Internal crates (dependency direction: domain <- storage <- server <- app)
domain = { path = "crates/domain" }
storage = { path = "crates/storage" }
server = { path = "crates/server" }

# External crates
dioxus = "=0.7.10"              # exact pin: must match the installed Dioxus CLI (`dx --version`)
# Server-side HTTP: auth middleware in `server` (phase-1.md step 7). Same versions Dioxus uses.
axum = { version = "0.8.9", default-features = false }
# Password hashing (argon2id; decision #028, phase-2.md milestone 2). Default features: salts
# come from the OS through `getrandom`, which the server already uses.
argon2 = "0.6.0"
dirs = "6.0.0"                   # per-user data folder on desktop; already used by dioxus-desktop
getrandom = "0.4.3"             # OS randomness for new IDs on the server (approved, phase-2.md 1d)
fluent-bundle = "0.16.0"        # translation engine (Project Fluent); see decisions.md #022
# SQLite with bundled SQLite (same version everywhere), embedded migrations, and the
# tokio runtime the server already uses. Runtime-checked queries: no `query!` macros
# (phase-2.md milestone 1 plan); `macros` is only for `sqlx::migrate!`.
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite-bundled", "runtime-tokio", "migrate", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"                   # session tokens are stored only as their SHA-256 (phase-2.md 2c)
serde_json = "1.0.154"
subtle = "2.6.1"                # constant-time credential comparison
tower = { version = "0.5.3", default-features = false }
tracing = "0.1.44"
# No env-filter: per-area levels use the lighter `Targets` filter. No ansi: colored
# terminal output would add nu-ansi-term (phase-1.md step 4).
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry", "fmt"] }
tracing-wasm = "0.2.1"          # browser devtools console output (web only)
# UUIDv7 record IDs (decisions.md #042). No features: domain supplies the time and
# random bytes itself, and needs no std-only or RNG code.
uuid = { version = "1.28.0", default-features = false }
unic-langid = "0.9.6"           # language identifiers (e.g. en-US) for fluent-bundle
web-time = "1.1.0"              # SystemTime that also works on wasm32 (std's panics there)

# Dev-only
proptest = "1"                    # property-based tests (AGENTS.md §7)
http-body-util = "0.1.5"        # reading response bodies in middleware tests
tempfile = "3.27.0"

# ---------------------------------------------------------------------------
# Rustc lints
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "forbid"               # no unsafe anywhere; cannot be overridden locally
missing_docs = "warn"                # every public item needs a /// doc comment (CI denies warnings)
unreachable_pub = "warn"             # keep `pub` honest: use pub(crate) when not exported
rust_2018_idioms = { level = "warn", priority = -1 }  # idiom group; priority lets later lints override
unused_qualifications = "warn"       # no redundant path prefixes

# ---------------------------------------------------------------------------
# Clippy lints
# ---------------------------------------------------------------------------
[workspace.lints.clippy]
# --- Lint groups (priority -1 so individual entries below take precedence) ---
all = { level = "warn", priority = -1 }        # clippy's default set
pedantic = { level = "warn", priority = -1 }   # stricter style and correctness checks

# --- Pedantic lints that are too noisy for this project ---
module_name_repetitions = "allow"   # e.g. `meter::MeterReading` is fine
must_use_candidate = "allow"        # would demand #[must_use] on most getters

# --- No crashing in production code (allowed in tests via clippy.toml) ---
unwrap_used = "deny"                # handle or propagate errors instead
expect_used = "deny"                # same; expect() is still a panic
panic = "deny"                      # no explicit panics
todo = "deny"                       # unfinished code can't merge
unimplemented = "deny"              # same
unreachable = "warn"                # require a comment/justification via #[expect]

# --- Output and debugging: use `tracing` instead ---
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"

# --- Documentation (pedantic already enables these; listed to make intent explicit) ---
missing_errors_doc = "warn"         # `# Errors` section on fallible public fns
missing_panics_doc = "warn"         # `# Panics` section if a fn can panic
doc_markdown = "warn"               # backticks around code identifiers in docs

# --- Lint suppression must be justified ---
# #[allow] is permitted sparingly, but every #[allow] and #[expect] must carry `reason = "..."`.
# (AGENTS.md also requires a justifying comment; reviewers check that part.)
allow_attributes_without_reason = "warn"

# --- Numeric safety: important for the integer <-> uom f64 boundary ---
# (pedantic enables cast_possible_truncation, cast_sign_loss, cast_precision_loss, float_cmp)
float_cmp_const = "warn"            # no exact equality on float constants
lossy_float_literal = "warn"        # float literals that can't be represented exactly

# --- Readability / anti-spaghetti ---
cognitive_complexity = "warn"       # threshold set in clippy.toml
too_many_lines = "warn"             # threshold set in clippy.toml
redundant_clone = "warn"            # avoid needless allocations
clone_on_ref_ptr = "warn"           # write Arc::clone(&x), not x.clone(), for clarity
str_to_string = "warn"              # consistent: use .to_owned()
large_enum_variant = "warn"         # keeps command/event enums lean
wildcard_enum_match_arm = "warn"    # `_ =>` hides new enum variants (matters for commands)
