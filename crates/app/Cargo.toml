[package]
name = "app"
description = "Dioxus UI for web, desktop, and mobile, plus thin server functions and the server entry point."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Library: everything testable (logging, later UI components and server functions).
# Binary: the thin entry point that `dx` builds and launches.
[lib]
path = "src/lib.rs"

[[bin]]
name = "app"
path = "src/main.rs"
doc = false             # avoids a rustdoc output collision with the `app` library

[dependencies]
domain.workspace = true
dioxus = { workspace = true, features = ["fullstack", "router"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
web-time.workspace = true

# Native-only crates, enabled only by the `server` feature so the web (WASM)
# build never pulls in sqlx.
storage = { workspace = true, optional = true }
server = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tracing-wasm.workspace = true

[dev-dependencies]
domain = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
# Server-feature tests: drive the real router (async runtime + oneshot requests).
tokio = { version = "1", features = ["macros", "rt"] }
tower = { workspace = true, features = ["util"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "dep:storage", "dep:server"]

[lints]
workspace = true
