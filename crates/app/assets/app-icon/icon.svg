  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#tile)"/>
  <path d="M 136 352 A 140 140 0 1 1 376 352" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round"/>
  <g stroke="#ffffff" stroke-width="18" stroke-linecap="round">
