# cargo-about: the Rust crates' licenses for THIRD-PARTY-NOTICES (decision #079).
# Made by scripts/notices.sh; the Main gate checks the committed file is current.

# The same licenses `deny.toml` allows: a crate under any other fails here too.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "NCSA",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

# What's shipped: the server image (Linux), the desktop app (macOS, Windows, Linux), and the
# web app (WebAssembly).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]

# Only what's compiled into the app: not the tests' or the build scripts' crates.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The workspace's own crates aren't third-party.
[private]
ignore = true
