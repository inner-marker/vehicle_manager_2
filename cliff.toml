# git-cliff configuration: generates CHANGELOG.md from Conventional Commit messages.
# https://git-cliff.org/docs/configuration
#
# Used during release preparation (docs/releasing.md). Never edit CHANGELOG.md by hand.
# The release workflow reads this version's section from the committed CHANGELOG.md.

[changelog]
header = """
# Changelog\n
All notable changes to this project are documented in this file. It is generated
from Conventional Commit messages by [git-cliff](https://git-cliff.org); don't edit it by hand.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
# One section per release. Headings must stay `## [x.y.z] - date`: the release
# scripts (scripts/release/) find a version's notes by that heading.
# Group names carry an HTML-comment number so groups sort in a fixed order; it's
# stripped before display. Numbers are zero-padded because they sort as text.
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
          {% if commit.breaking %}**[breaking]** {% endif %}\
          {{ commit.message | split(pat="\n") | first | upper_first | trim }} \
          ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/inner-marker/vehicle_manager_2/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
"""
footer = """
{% for release in releases -%}
    {% if release.version and release.previous and release.previous.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            https://github.com/inner-marker/vehicle_manager_2/compare/{{ release.previous.version }}..{{ release.version }}
    {% elif release.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            https://github.com/inner-marker/vehicle_manager_2/tree/{{ release.version }}
    {% elif release.previous and release.previous.version -%}
        [unreleased]: https://github.com/inner-marker/vehicle_manager_2/compare/{{ release.previous.version }}..HEAD
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
trim = true
# Squash-merged PRs end in "(#N)"; turn that into a link to the PR.
postprocessors = [
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/inner-marker/vehicle_manager_2/pull/${1}))" },
]

[git]
conventional_commits = true
# Skip commits that aren't Conventional Commits (e.g. the initial "Setting up workspace.").
filter_unconventional = true
# Skip commits no parser below matches (e.g. milestone PR merge commits).
filter_commits = true
# A breaking change is always listed, even if a parser would skip it.
protect_breaking_commits = true
# Release tags look like v1.2.3 (decision: tags vX.Y.Z on main only).
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
topo_order = false
# First match wins, so the specific patterns come before the general ones.
commit_parsers = [
    # Milestone PRs are merge commits (decisions.md #021); their steps are listed individually.
    { message = "^Merge ", skip = true },
    { field = "breaking", pattern = "true", group = "<!-- 00 -->Breaking changes" },
    # Dependabot updates (dependabot.yml prefixes).
    { message = "^(build|ci)\\(deps\\)", group = "<!-- 10 -->Dependencies" },
    { message = "^feat", group = "<!-- 01 -->Features" },
    { message = "^fix", group = "<!-- 02 -->Fixes" },
    { message = "^perf", group = "<!-- 03 -->Performance" },
    { message = "^refactor", group = "<!-- 04 -->Refactoring" },
    { message = "^docs", group = "<!-- 05 -->Documentation" },
    { message = "^test", group = "<!-- 06 -->Tests" },
    { message = "^build", group = "<!-- 07 -->Build" },
    { message = "^ci", group = "<!-- 08 -->CI" },
    { message = "^chore", group = "<!-- 09 -->Chores" },
]
