<text x="1250" y="812" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">• Step 1 asks only for the code; Next checks it</text>
<text x="1250" y="834" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">  with the server, and wrong codes count toward</text>
<text x="1250" y="856" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">  the attempt limit.</text>
<text x="1250" y="878" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">• Step 2 sends the code again with the account,</text>
<text x="1250" y="900" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">  and the server checks it again before creating</text>
