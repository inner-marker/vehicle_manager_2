<text x="1250" y="944" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">• ← Back keeps what was typed.</text>
<text x="1250" y="966" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">• Creating the Admin signs you straight in.</text>
