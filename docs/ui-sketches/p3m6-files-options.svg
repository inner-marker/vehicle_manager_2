<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1110" font-family="-apple-system, Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#f5f6f8"/>
<text x="24" y="40" font-size="22" fill="#1b1f24" font-weight="700" text-anchor="start">Phase 3 · milestone 6 · Files on the desktop: layout options</text>
<text x="24" y="64" font-size="13" fill="#5b6470" font-weight="400" text-anchor="start">Dark theme shown. Each row: two options side by side. Wording is a draft.</text>
<text x="24" y="100" font-size="17" fill="#1b1f24" font-weight="700" text-anchor="start">1 · Offline: a photo whose full size isn&#x27;t on this computer</text>
<text x="24" y="120" font-size="12.5" fill="#5b6470" font-weight="400" text-anchor="start">Its thumbnail always is (thumbnails and PDFs download by themselves); the full photo only once opened online.</text>
<rect x="24" y="140" width="460" height="300" rx="12" fill="#14171c" stroke="#14171c"/>
<text x="44" y="170" font-size="16" fill="#e8eaed" font-weight="700" text-anchor="start">1A · The thumbnail, enlarged, with a note</text>
<text x="44" y="190" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">Something to see; the note says what&#x27;s missing</text>
<rect x="44" y="206" width="420" height="214" rx="6" fill="#101318" stroke="#333a45"/>
<rect x="144" y="220" width="220" height="150" rx="6" fill="#2b3a4f" stroke="#3c4b60"/>
<polygon points="152,362 232.0,287.5 276.0,317.5 309.0,295.0 356,362" fill="#3f5a7a"/>
<circle cx="309.0" cy="262.0" r="12.0" fill="#c9d6e6"/>
<rect x="144" y="220" width="220" height="150" rx="6" fill="none" stroke="#101318"/>
<text x="254" y="392" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="middle">Full size downloads when this computer</text>
<text x="254" y="408" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="middle">can reach the server (a small preview).</text>
<rect x="516" y="140" width="460" height="300" rx="12" fill="#14171c" stroke="#14171c"/>
<text x="536" y="170" font-size="16" fill="#e8eaed" font-weight="700" text-anchor="start">1B · A placeholder</text>
<text x="536" y="190" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">Plain: nothing pretends to be the photo</text>
<rect x="536" y="206" width="420" height="214" rx="6" fill="#101318" stroke="#333a45"/>
<rect x="646" y="236" width="200" height="120" rx="8" fill="#1d2128" stroke="#4a525e" stroke-dasharray="5 4"/>
<text x="746" y="290" font-size="28" fill="#9aa1ab" font-weight="400" text-anchor="middle">☁</text>
<text x="746" y="324" font-size="12" fill="#9aa1ab" font-weight="400" text-anchor="middle">Not on this computer yet</text>
<text x="746" y="388" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="middle">It downloads when the server can be reached.</text>
<text x="24" y="470" font-size="17" fill="#1b1f24" font-weight="700" text-anchor="start">2 · A photo added offline, not yet uploaded</text>
<text x="24" y="490" font-size="12.5" fill="#5b6470" font-weight="400" text-anchor="start">It shows at once, from this computer; it uploads before the change that uses it is sent.</text>
<rect x="24" y="510" width="460" height="230" rx="12" fill="#14171c" stroke="#14171c"/>
<text x="44" y="540" font-size="16" fill="#e8eaed" font-weight="700" text-anchor="start">2A · A small badge on the tile</text>
<text x="44" y="560" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">The tile as usual; ↑ in the corner, tooltip says why</text>
<rect x="44" y="586" width="92" height="92" rx="6" fill="#2b3a4f" stroke="#3c4b60"/>
<polygon points="52,670 80.80000000000001,627.4 99.19999999999999,645.8 113.0,632.0 128,670" fill="#3f5a7a"/>
<circle cx="113.0" cy="611.76" r="7.36" fill="#c9d6e6"/>
<rect x="148" y="586" width="92" height="92" rx="6" fill="#2b3a4f" stroke="#3c4b60"/>
<polygon points="156,670 184.8,627.4 203.2,645.8 217.0,632.0 232,670" fill="#3f5a7a"/>
<circle cx="217.0" cy="611.76" r="7.36" fill="#c9d6e6"/>
<rect x="252" y="586" width="92" height="92" rx="6" fill="#2b3a4f" stroke="#3c4b60"/>
<polygon points="260,670 288.8,627.4 307.2,645.8 321.0,632.0 336,670" fill="#3f5a7a"/>
<circle cx="321.0" cy="611.76" r="7.36" fill="#c9d6e6"/>
<rect x="312" y="590" width="28" height="20" rx="10" fill="#16263d" stroke="#4a8fe7"/>
<text x="326" y="604" font-size="12" fill="#4a8fe7" font-weight="700" text-anchor="middle">↑</text>
<text x="44" y="706" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">Tooltip: &quot;Waiting to upload (offline).&quot;</text>
<rect x="516" y="510" width="460" height="230" rx="12" fill="#14171c" stroke="#14171c"/>
<text x="536" y="540" font-size="16" fill="#e8eaed" font-weight="700" text-anchor="start">2B · Dimmed, with a caption</text>
<text x="536" y="560" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">Clearer, but looks broken at a glance</text>
<rect x="536" y="586" width="92" height="92" rx="6" fill="#2b3a4f" stroke="#3c4b60"/>
<polygon points="544,670 572.8,627.4 591.2,645.8 605.0,632.0 620,670" fill="#3f5a7a"/>
<circle cx="605.0" cy="611.76" r="7.36" fill="#c9d6e6"/>
<rect x="640" y="586" width="92" height="92" rx="6" fill="#2b3a4f" stroke="#3c4b60"/>
<polygon points="648,670 676.8,627.4 695.2,645.8 709.0,632.0 724,670" fill="#3f5a7a"/>
<circle cx="709.0" cy="611.76" r="7.36" fill="#c9d6e6"/>
<rect x="744" y="586" width="92" height="92" rx="6" fill="#2b3a4f" stroke="#3c4b60"/>
<polygon points="752,670 780.8,627.4 799.2,645.8 813.0,632.0 828,670" fill="#3f5a7a"/>
<circle cx="813.0" cy="611.76" r="7.36" fill="#c9d6e6"/>
<rect x="744" y="586" width="92" height="92" rx="6" fill="#14171c" opacity="0.55"/>
<text x="790" y="694" font-size="10.5" fill="#f2b84b" font-weight="600" text-anchor="middle">Waiting to upload</text>
<text x="24" y="770" font-size="17" fill="#1b1f24" font-weight="700" text-anchor="start">3 · How much disk photos may use</text>
<text x="24" y="790" font-size="12.5" fill="#5b6470" font-weight="400" text-anchor="start">Default 2 GB; past it, the photos opened longest ago are dropped (thumbnails, PDFs, and anything unsent never are).</text>
<rect x="24" y="810" width="460" height="250" rx="12" fill="#14171c" stroke="#14171c"/>
<text x="44" y="840" font-size="16" fill="#e8eaed" font-weight="700" text-anchor="start">3A · Settings → This device</text>
<text x="44" y="860" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">Beside Lock after: it&#x27;s per computer</text>
<rect x="44" y="880" width="420" height="150" rx="6" fill="#1d2128" stroke="#333a45"/>
<text x="60" y="906" font-size="11.5" fill="#9aa1ab" font-weight="700" text-anchor="start">THIS DEVICE</text>
<text x="60" y="934" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">Lock after</text>
<rect x="300" y="920" width="150" height="26" rx="6" fill="#262b34" stroke="#4a525e"/>
<text x="312" y="938" font-size="12" fill="#e8eaed" font-weight="400" text-anchor="start">15 minutes ▾</text>
<text x="60" y="970" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">Keep photos up to</text>
<rect x="300" y="956" width="150" height="26" rx="6" fill="#262b34" stroke="#4a525e"/>
<text x="312" y="974" font-size="12" fill="#e8eaed" font-weight="400" text-anchor="start">2 GB ▾</text>
<text x="60" y="1006" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">Photos kept: 340 MB of 2 GB · files in all: 410 MB</text>
<rect x="516" y="810" width="460" height="250" rx="12" fill="#14171c" stroke="#14171c"/>
<text x="536" y="840" font-size="16" fill="#e8eaed" font-weight="700" text-anchor="start">3B · Diagnostics → Offline copy</text>
<text x="536" y="860" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">With the copy&#x27;s other numbers</text>
<rect x="536" y="880" width="420" height="150" rx="6" fill="#1d2128" stroke="#333a45"/>
<text x="552" y="906" font-size="11.5" fill="#9aa1ab" font-weight="700" text-anchor="start">OFFLINE COPY</text>
<text x="552" y="934" font-size="12" fill="#9aa1ab" font-weight="400" text-anchor="start">Status</text>
<text x="700" y="934" font-size="12" fill="#e8eaed" font-weight="400" text-anchor="start">Up to date</text>
