<text x="700" y="982" font-size="12" fill="#e8eaed" font-weight="400" text-anchor="start">340 MB of 2 GB</text>
<rect x="700" y="994" width="120" height="26" rx="6" fill="#262b34" stroke="#4a525e"/>
