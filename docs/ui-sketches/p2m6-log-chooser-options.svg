<text x="174" y="264" font-size="12" fill="#9aa1ab" font-weight="600" text-anchor="start">Vehicle</text>
<rect x="174" y="272" width="372" height="40" rx="8" fill="#14171c" stroke="#333a45" stroke-width="1.5"/>
<text x="186" y="297.0" font-size="13.5" fill="#e8eaed" font-weight="500" text-anchor="start">Truck  ·  same as last time</text>
<text x="534" y="297.0" font-size="11" fill="#9aa1ab" font-weight="400" text-anchor="end">▾</text>
<rect x="174" y="330" width="372" height="72" rx="12" fill="#1d2128" stroke="#333a45" stroke-width="1.5"/>
<text x="192" y="368" font-size="24" fill="#e8eaed" font-weight="400" text-anchor="start">⛽</text>
<text x="230" y="360" font-size="16" fill="#e8eaed" font-weight="700" text-anchor="start">Fuel-up</text>
<text x="230" y="380" font-size="12" fill="#9aa1ab" font-weight="400" text-anchor="start">Odometer, fuel, and price</text>
<rect x="174" y="414" width="372" height="72" rx="12" fill="#1d2128" stroke="#333a45" stroke-width="1.5"/>
<text x="192" y="452" font-size="24" fill="#e8eaed" font-weight="400" text-anchor="start">⏱</text>
<text x="230" y="444" font-size="16" fill="#e8eaed" font-weight="700" text-anchor="start">Reading</text>
<text x="230" y="464" font-size="12" fill="#9aa1ab" font-weight="400" text-anchor="start">Just the meters (odometer, hours)</text>
<text x="174" y="516" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">Viewers see no tiles: &quot;You can see this vehicle,</text>
<text x="174" y="534" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">but not log for it.&quot;</text>
