<text x="114" y="974" font-size="16" fill="#e8eaed" font-weight="700" text-anchor="start">Reading</text>
<text x="114" y="994" font-size="12" fill="#9aa1ab" font-weight="400" text-anchor="start"></text>
<text x="165" y="1054" font-size="13" fill="#5aa9ff" font-weight="600" text-anchor="middle">Cancel</text>
<text x="320" y="752" font-size="13" fill="#9aa1ab" font-weight="600" text-anchor="start">Phone · step 2</text>
<rect x="320" y="764" width="250" height="520" rx="24" fill="#14171c" stroke="#4a535e" stroke-width="2"/>
<text x="338" y="790" font-size="11.5" fill="#9aa1ab" font-weight="600" text-anchor="start">9:41</text>
<text x="338" y="816" font-size="14" fill="#5aa9ff" font-weight="600" text-anchor="start">‹ Fuel-up for…</text>
<text x="338" y="852" font-size="18" fill="#e8eaed" font-weight="800" text-anchor="start">Which vehicle?</text>
<rect x="338" y="870" width="214" height="58" rx="10" fill="#262b34" stroke="#5aa9ff" stroke-width="2"/>
<text x="352" y="895" font-size="15" fill="#e8eaed" font-weight="700" text-anchor="start">Truck</text>
<text x="352" y="915" font-size="12" fill="#9aa1ab" font-weight="400" text-anchor="start">52,310 mi · Last time</text>
<rect x="338" y="936" width="214" height="58" rx="10" fill="#1d2128" stroke="#333a45" stroke-width="1.5"/>
