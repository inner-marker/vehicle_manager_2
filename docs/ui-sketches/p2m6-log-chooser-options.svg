<text x="674" y="864" font-size="14" fill="#e8eaed" font-weight="700" text-anchor="start">Truck</text>
<text x="674" y="882" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">52,310 mi · Last time</text>
<rect x="660" y="900" width="280" height="50" rx="10" fill="#14171c" stroke="#333a45" stroke-width="1.5"/>
<text x="674" y="922" font-size="14" fill="#e8eaed" font-weight="700" text-anchor="start">Car</text>
<text x="674" y="940" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">18,044 mi</text>
<rect x="660" y="958" width="280" height="50" rx="10" fill="#14171c" stroke="#333a45" stroke-width="1.5"/>
<text x="674" y="980" font-size="14" fill="#e8eaed" font-weight="700" text-anchor="start">Tractor</text>
<text x="674" y="998" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">1,204 h</text>
<text x="1030" y="804" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">+ Each step is big and simple;</text>
<text x="1030" y="826" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">   easy with gloves.</text>
<text x="1030" y="848" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">+ Each vehicle&#x27;s latest reading</text>
<text x="1030" y="870" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">   shows it&#x27;s the right one.</text>
<text x="1030" y="892" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">+ One vehicle: step 2 is skipped.</text>
<text x="1030" y="914" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">− Always two taps, even for the</text>
<text x="1030" y="936" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">   same vehicle as last time.</text>
