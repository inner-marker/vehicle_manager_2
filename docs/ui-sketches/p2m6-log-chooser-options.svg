<text x="496.0" y="569.0" font-size="14.5" fill="#e8eaed" font-weight="600" text-anchor="middle">Cancel</text>
<text x="720" y="152" font-size="13" fill="#9aa1ab" font-weight="600" text-anchor="start">Phone · a sheet from the + button</text>
<rect x="720" y="164" width="250" height="520" rx="24" fill="#14171c" stroke="#4a535e" stroke-width="2"/>
<text x="738" y="190" font-size="11.5" fill="#9aa1ab" font-weight="600" text-anchor="start">9:41</text>
