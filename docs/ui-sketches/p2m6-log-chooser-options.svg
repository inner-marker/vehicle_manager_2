<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1330" viewBox="0 0 1560 1330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<rect x="0" y="0" width="1560" height="1330" rx="0" fill="#0d1014"/>
<text x="40" y="48" font-size="22" fill="#e8eaed" font-weight="800" text-anchor="start">Phase 2 · step 6g · The + Log chooser: two options</text>
<text x="40" y="74" font-size="14" fill="#9aa1ab" font-weight="400" text-anchor="start">From + Log (the top bar, or the floating button on phones). Only what the person may log is offered (role and mode); squawks and maintenance come later.</text>
<text x="40" y="124" font-size="15" fill="#e8eaed" font-weight="700" text-anchor="start">A · One dialog: the vehicle at the top (last time&#x27;s chosen), then what to log</text>
<text x="40" y="152" font-size="13" fill="#9aa1ab" font-weight="600" text-anchor="start">Wide (web, desktop) · the page dims behind</text>
<rect x="40" y="164" width="640" height="470" rx="10" fill="#14171c" stroke="#4a535e" stroke-width="2"/>
<rect x="150" y="198" width="420" height="400" rx="14" fill="#1d2128" stroke="#4a535e" stroke-width="2"/>
