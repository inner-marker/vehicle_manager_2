<text x="352" y="1113" font-size="12" fill="#9aa1ab" font-weight="400" text-anchor="start">9,870 mi</text>
<text x="338" y="1154" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">Only vehicles with fuel-ups, that</text>
<text x="338" y="1172" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">the person may log for, are listed.</text>
<text x="610" y="752" font-size="13" fill="#9aa1ab" font-weight="600" text-anchor="start">Wide · the same two steps in a dialog</text>
