<text x="796" y="530" font-size="16" fill="#e8eaed" font-weight="700" text-anchor="start">Fuel-up</text>
<text x="796" y="550" font-size="12" fill="#9aa1ab" font-weight="400" text-anchor="start"></text>
<rect x="740" y="574" width="210" height="64" rx="12" fill="#1d2128" stroke="#333a45" stroke-width="1.5"/>
<text x="758" y="612" font-size="24" fill="#e8eaed" font-weight="400" text-anchor="start">⏱</text>
<text x="796" y="604" font-size="16" fill="#e8eaed" font-weight="700" text-anchor="start">Reading</text>
<text x="796" y="624" font-size="12" fill="#9aa1ab" font-weight="400" text-anchor="start"></text>
<text x="845" y="660" font-size="13" fill="#5aa9ff" font-weight="600" text-anchor="middle">Cancel</text>
<text x="1010" y="204" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">+ One screen: with the right vehicle</text>
<text x="1010" y="226" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">   already chosen, it&#x27;s one tap.</text>
<text x="1010" y="248" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">+ The vehicle is a plain dropdown.</text>
<text x="1010" y="270" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">+ From a vehicle&#x27;s page, + Log</text>
<text x="1010" y="292" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">   chooses that vehicle.</text>
<text x="1010" y="314" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">− Many vehicles make a long dropdown</text>
<text x="1010" y="336" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">   (the last one is first).</text>
<text x="40" y="724" font-size="15" fill="#e8eaed" font-weight="700" text-anchor="start">B · Two steps: what to log first, then the vehicle (last time&#x27;s first, with its latest reading)</text>
<text x="40" y="752" font-size="13" fill="#9aa1ab" font-weight="600" text-anchor="start">Phone · step 1</text>
<rect x="40" y="764" width="250" height="520" rx="24" fill="#14171c" stroke="#4a535e" stroke-width="2"/>
<text x="58" y="790" font-size="11.5" fill="#9aa1ab" font-weight="600" text-anchor="start">9:41</text>
<text x="58" y="824" font-size="20" fill="#e8eaed" font-weight="800" text-anchor="start">Log</text>
