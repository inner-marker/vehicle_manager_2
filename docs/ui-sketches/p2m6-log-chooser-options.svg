<text x="114" y="898" font-size="12" fill="#9aa1ab" font-weight="400" text-anchor="start"></text>
<rect x="58" y="944" width="214" height="84" rx="12" fill="#1d2128" stroke="#333a45" stroke-width="1.5"/>
