<text x="24" y="40" font-size="22" fill="#1b1f24" font-weight="700" text-anchor="start">Phase 5 · milestone 6 · Readiness: layout options</text>
<text x="24" y="64" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">Dark theme. Each vehicle has usages (Drivable by default; Local, Highway, Towing added); each usage stands alone. ✓ ready · ! a warning · ✗ not ready, always with words.</text>
