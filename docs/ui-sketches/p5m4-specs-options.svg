<text x="24" y="40" font-size="22" fill="#1b1f24" font-weight="700" text-anchor="start">Phase 5 · milestone 4 · Specs, templates, and logging a service: layout options</text>
<text x="24" y="64" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">Dark theme. Specs: a name, an amount in its own unit with the other system beside it, a part number, a detail, a note.</text>
