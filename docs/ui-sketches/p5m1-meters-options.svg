<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1370" font-family="-apple-system, Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#f5f6f8"/>
<text x="24" y="40" font-size="22" fill="#1b1f24" font-weight="700" text-anchor="start">Phase 5 · milestone 1 · Meters: layout options</text>
<text x="24" y="64" font-size="13" fill="#5b6470" font-weight="400" text-anchor="start">Dark theme shown. Each row: two options side by side. Wording is a draft. Example: the truck&#x27;s Oil life.</text>
<text x="24" y="100" font-size="17" fill="#1b1f24" font-weight="700" text-anchor="start">1 · The meter dialog (Setup → Meters → + Meter)</text>
<text x="24" y="120" font-size="12.5" fill="#5b6470" font-weight="400" text-anchor="start">Adds Percentage, which way it counts, and resetting. Direction is fixed once the meter has a reading.</text>
<rect x="24" y="140" width="460" height="470" rx="12" fill="#14171c" stroke="#14171c"/>
<text x="44" y="170" font-size="16" fill="#e8eaed" font-weight="700" text-anchor="start">1A · Everything on the form</text>
<text x="44" y="190" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">Today&#x27;s fields, plus two new rows</text>
<text x="44" y="220" font-size="11" fill="#9aa1ab" font-weight="400" text-anchor="start">Name</text>
<rect x="44" y="226" width="420" height="28" rx="6" fill="#101318" stroke="#333a45"/>
<text x="54" y="245" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">Oil life</text>
<text x="44" y="274" font-size="11" fill="#9aa1ab" font-weight="400" text-anchor="start">Measures</text>
<rect x="44" y="280" width="200" height="28" rx="6" fill="#101318" stroke="#333a45"/>
<text x="54" y="299" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">Percentage  ▾</text>
<text x="264" y="274" font-size="11" fill="#9aa1ab" font-weight="400" text-anchor="start">Unit</text>
<rect x="264" y="280" width="200" height="28" rx="6" fill="#101318" stroke="#333a45"/>
<text x="274" y="299" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">%  ▾</text>
<text x="44" y="328" font-size="11" fill="#9aa1ab" font-weight="400" text-anchor="start">Decimal places</text>
<rect x="44" y="334" width="200" height="28" rx="6" fill="#101318" stroke="#333a45"/>
<text x="54" y="353" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">None (52%)  ▾</text>
<text x="44" y="384" font-size="11" fill="#9aa1ab" font-weight="400" text-anchor="start">Counts</text>
<rect x="44" y="390" width="38.4" height="28" rx="6" fill="#101318" stroke="#333a45"/>
<text x="63.2" y="409" font-size="12" fill="#e8eaed" font-weight="400" text-anchor="middle">Up</text>
<rect x="88.4" y="390" width="52.8" height="28" rx="6" fill="#16263d" stroke="#4a8fe7"/>
<text x="114.80000000000001" y="409" font-size="12" fill="#4a8fe7" font-weight="600" text-anchor="middle">Down</text>
<text x="174" y="409" font-size="11" fill="#9aa1ab" font-weight="400" text-anchor="start">Down: e.g. Oil life, 100% → 0%</text>
<rect x="44" y="439" width="14" height="14" rx="3" fill="#4a8fe7" stroke="#4a8fe7"/>
<text x="51" y="450" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">✓</text>
<text x="66" y="450" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">Can be reset</text>
<text x="66" y="468" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">to</text>
<rect x="88" y="454" width="70" height="26" rx="6" fill="#101318" stroke="#333a45"/>
<text x="98" y="472" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">100</text>
<text x="166" y="472" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">%  (when the oil is changed)</text>
<text x="44" y="500" font-size="11" fill="#9aa1ab" font-weight="400" text-anchor="start">What drives it (optional)</text>
<rect x="44" y="506" width="420" height="28" rx="6" fill="#101318" stroke="#333a45"/>
<text x="54" y="525" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">The dash&#x27;s oil-life monitor</text>
<text x="44" y="564" font-size="12" fill="#e8eaed" font-weight="400" text-anchor="start">Required for:  ☐ Fuel-up  ☐ Reading  ☑ Maintenance</text>
<rect x="294" y="580" width="68.4" height="28" rx="6" fill="#262b34" stroke="#333a45"/>
<text x="328.2" y="599" font-size="12" fill="#e8eaed" font-weight="600" text-anchor="middle">Cancel</text>
<rect x="374" y="580" width="90" height="28" rx="6" fill="#4a8fe7" stroke="#4a8fe7"/>
<text x="419.0" y="599" font-size="12" fill="#fff" font-weight="600" text-anchor="middle">Save</text>
<rect x="516" y="140" width="460" height="470" rx="12" fill="#14171c" stroke="#14171c"/>
<text x="536" y="170" font-size="16" fill="#e8eaed" font-weight="700" text-anchor="start">1B · Start from a kind of meter</text>
<text x="536" y="190" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">A first choice fills the form; everything stays editable</text>
<text x="536" y="222" font-size="12.5" fill="#e8eaed" font-weight="600" text-anchor="start">What kind of meter?</text>
<rect x="536" y="236" width="420" height="44" rx="6" fill="#1d2128" stroke="#333a45"/>
<text x="550" y="255" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">○ Distance, like an odometer</text>
<text x="568" y="271" font-size="11" fill="#9aa1ab" font-weight="400" text-anchor="start">counts up · mi or km</text>
<rect x="536" y="288" width="420" height="44" rx="6" fill="#1d2128" stroke="#333a45"/>
<text x="550" y="307" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">○ Hours, like an engine-hour meter</text>
<text x="568" y="323" font-size="11" fill="#9aa1ab" font-weight="400" text-anchor="start">counts up · hours</text>
<rect x="536" y="340" width="420" height="44" rx="6" fill="#16263d" stroke="#4a8fe7"/>
<text x="550" y="359" font-size="12.5" fill="#e8eaed" font-weight="600" text-anchor="start">◉ Life remaining, like Oil life</text>
<text x="568" y="375" font-size="11" fill="#9aa1ab" font-weight="400" text-anchor="start">counts down · % · resets to 100%</text>
<rect x="536" y="392" width="420" height="44" rx="6" fill="#1d2128" stroke="#333a45"/>
<text x="550" y="411" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">○ Something else</text>
<text x="568" y="427" font-size="11" fill="#9aa1ab" font-weight="400" text-anchor="start">choose every setting</text>
<text x="536" y="462" font-size="11" fill="#9aa1ab" font-weight="400" text-anchor="start">Name</text>
<rect x="536" y="468" width="420" height="28" rx="6" fill="#101318" stroke="#333a45"/>
<text x="546" y="487" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">Oil life</text>
<text x="536" y="524" font-size="11.5" fill="#4a8fe7" font-weight="400" text-anchor="start">▸ Settings: Percentage · %, no decimals · counts down · resets to 100%</text>
<text x="536" y="542" font-size="11" fill="#9aa1ab" font-weight="400" text-anchor="start">(opens the same rows as 1A)</text>
<rect x="786" y="580" width="68.4" height="28" rx="6" fill="#262b34" stroke="#333a45"/>
<text x="820.2" y="599" font-size="12" fill="#e8eaed" font-weight="600" text-anchor="middle">Cancel</text>
<rect x="866" y="580" width="90" height="28" rx="6" fill="#4a8fe7" stroke="#4a8fe7"/>
<text x="911.0" y="599" font-size="12" fill="#fff" font-weight="600" text-anchor="middle">Save</text>
<text x="24" y="650" font-size="17" fill="#1b1f24" font-weight="700" text-anchor="start">2 · Recording a reset on a reading (any event with readings)</text>
<text x="24" y="670" font-size="12.5" fill="#5b6470" font-weight="400" text-anchor="start">Only resettable meters offer it. A reset reading&#x27;s value is the new start; the check starts afresh from it.</text>
<rect x="24" y="690" width="460" height="250" rx="12" fill="#14171c" stroke="#14171c"/>
<text x="44" y="720" font-size="16" fill="#e8eaed" font-weight="700" text-anchor="start">2A · A Reset tick beside the reading</text>
<text x="44" y="740" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">Ticking fills the reset value; it stays editable</text>
<text x="44" y="770" font-size="11" fill="#9aa1ab" font-weight="400" text-anchor="start">Odometer (last 52,644 mi)</text>
<rect x="44" y="776" width="200" height="28" rx="6" fill="#101318" stroke="#333a45"/>
<text x="54" y="795" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">52,910</text>
<text x="44" y="824" font-size="11" fill="#9aa1ab" font-weight="400" text-anchor="start">Oil life (last 18%)</text>
<rect x="44" y="830" width="120" height="28" rx="6" fill="#101318" stroke="#333a45"/>
<text x="54" y="849" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">100</text>
<text x="174" y="849" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">%</text>
<rect x="204" y="838" width="14" height="14" rx="3" fill="#4a8fe7" stroke="#4a8fe7"/>
<text x="211" y="849" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">✓</text>
<text x="226" y="849" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">↺ Reset</text>
<text x="44" y="886" font-size="12" fill="#57ab5a" font-weight="400" text-anchor="start">Oil life was reset: 18% → 100%.</text>
<text x="44" y="906" font-size="11" fill="#9aa1ab" font-weight="400" text-anchor="start">Without the tick, 100% would be refused (row 3).</text>
<rect x="516" y="690" width="460" height="250" rx="12" fill="#14171c" stroke="#14171c"/>
<text x="536" y="720" font-size="16" fill="#e8eaed" font-weight="700" text-anchor="start">2B · A Reset button</text>
<text x="536" y="740" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">One click; a chip says it&#x27;s a reset, ✕ undoes it</text>
<text x="536" y="770" font-size="11" fill="#9aa1ab" font-weight="400" text-anchor="start">Odometer (last 52,644 mi)</text>
<rect x="536" y="776" width="200" height="28" rx="6" fill="#101318" stroke="#333a45"/>
<text x="546" y="795" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">52,910</text>
<text x="536" y="824" font-size="11" fill="#9aa1ab" font-weight="400" text-anchor="start">Oil life (last 18%)</text>
<rect x="536" y="830" width="120" height="28" rx="6" fill="#101318" stroke="#333a45"/>
<text x="546" y="849" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">100</text>
<text x="666" y="849" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">%</text>
<rect x="696" y="831" width="110" height="26" rx="13" fill="#173022" stroke="#57ab5a"/>
<text x="751" y="849" font-size="11" fill="#57ab5a" font-weight="600" text-anchor="middle">↺ Reset to 100%  ✕</text>
<text x="536" y="886" font-size="12" fill="#e8eaed" font-weight="400" text-anchor="start">Before the click: a  [ ↺ Reset to 100% ]  button sits there.</text>
<text x="536" y="906" font-size="11" fill="#9aa1ab" font-weight="400" text-anchor="start">Typing another value keeps the chip (e.g. a reset to 95%).</text>
<text x="24" y="980" font-size="17" fill="#1b1f24" font-weight="700" text-anchor="start">3 · A reading that goes the wrong way, and how resets show</text>
<text x="24" y="1000" font-size="12.5" fill="#5b6470" font-weight="400" text-anchor="start">Counting down: equal is fine (Oil life can sit at 0%), higher is refused unless it&#x27;s a reset.</text>
<rect x="24" y="1020" width="460" height="290" rx="12" fill="#14171c" stroke="#14171c"/>
<text x="44" y="1050" font-size="16" fill="#e8eaed" font-weight="700" text-anchor="start">3A · The refusal offers the fix</text>
<text x="44" y="1070" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">On a resettable meter, the message has a button</text>
<text x="44" y="1100" font-size="11" fill="#9aa1ab" font-weight="400" text-anchor="start">Oil life (last 18% on 3 Nov)</text>
<rect x="44" y="1106" width="120" height="28" rx="6" fill="#101318" stroke="#333a45"/>
<text x="54" y="1125" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">62</text>
<text x="174" y="1125" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">%</text>
<rect x="44" y="1144" width="420" height="62" rx="6" fill="#3a1d1d" stroke="#e5534b"/>
<text x="56" y="1164" font-size="12" fill="#e5534b" font-weight="600" text-anchor="start">Oil life counts down: 62% is above 18% on 3 Nov.</text>
<text x="56" y="1184" font-size="11.5" fill="#e8eaed" font-weight="400" text-anchor="start">If the oil was changed, mark this reading as a reset.</text>
<rect x="334" y="1210" width="142.4" height="28" rx="6" fill="#262b34" stroke="#333a45"/>
<text x="405.2" y="1229" font-size="12" fill="#e8eaed" font-weight="600" text-anchor="middle">↺ It was a reset</text>
<text x="44" y="1264" font-size="11.5" fill="#e8eaed" font-weight="400" text-anchor="start">Timeline: Reading · 9 Nov · Odometer 52,910 mi · Oil life 62% ↺</text>
<text x="44" y="1282" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">Setup → Meters: Oil life · % · counts down · resets to 100%</text>
<rect x="516" y="1020" width="460" height="290" rx="12" fill="#14171c" stroke="#14171c"/>
<text x="536" y="1050" font-size="16" fill="#e8eaed" font-weight="700" text-anchor="start">3B · The refusal only explains</text>
<text x="536" y="1070" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">The fix is the Reset tick or button from row 2</text>
<text x="536" y="1100" font-size="11" fill="#9aa1ab" font-weight="400" text-anchor="start">Oil life (last 18% on 3 Nov)</text>
<rect x="536" y="1106" width="120" height="28" rx="6" fill="#101318" stroke="#333a45"/>
<text x="546" y="1125" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">62</text>
<text x="666" y="1125" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">%</text>
<rect x="536" y="1144" width="420" height="62" rx="6" fill="#3a1d1d" stroke="#e5534b"/>
<text x="548" y="1164" font-size="12" fill="#e5534b" font-weight="600" text-anchor="start">Oil life counts down: 62% is above 18% on 3 Nov.</text>
<text x="548" y="1184" font-size="11.5" fill="#e8eaed" font-weight="400" text-anchor="start">Lower it, or use ↺ Reset if the oil was changed.</text>
<text x="536" y="1264" font-size="11.5" fill="#e8eaed" font-weight="400" text-anchor="start">Timeline: Reading · 9 Nov · Odometer 52,910 mi · Oil life 62% ↺ reset</text>
<text x="536" y="1282" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">Setup → Meters: Oil life · % · counts down · resets to 100%</text>
<text x="24" y="1340" font-size="13" fill="#1b1f24" font-weight="600" text-anchor="start">Recommended: 1A, 2A, 3A (fewest new ideas; the fix is offered where the problem is seen).</text>
</svg>
