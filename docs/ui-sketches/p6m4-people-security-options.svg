<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1580" viewBox="0 0 1000 1580" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><rect width="1000" height="1580" fill="#f5f6f8"/><text x="24" y="40" font-size="22" fill="#1b1f24" font-weight="700" text-anchor="start">Phase 6 · milestone 4 · People and security: layouts</text><text x="24" y="64" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">Dark theme. Your choices: custom roles as permission sets (mode picker unchanged); names changed by the Admin, or by each person when the household</text><text x="24" y="82" font-size="12" fill="#5b6470" font-weight="400" text-anchor="start">allows it (off by default); email set only in .env with the password in a file; limits as proposed. Where there are options, the first is recommended.</text><text x="24" y="112" font-size="17" fill="#1b1f24" font-weight="700" text-anchor="start">1 · Manage → Roles (Admin mode)</text><text x="24" y="132" font-size="12.5" fill="#5b6470" font-weight="400" text-anchor="start">Laid out like Groups and Vehicle types: the list on the left, the chosen role on the right. The built-in roles are shown, read only.</text><rect x="24" y="148" width="952" height="430" rx="12" fill="#14171c" stroke="#14171c" stroke-width="1"/><text x="44" y="176" font-size="11" fill="#79b8ff" font-weight="700" text-anchor="start">A · LIST AND DETAIL (RECOMMENDED)</text><rect x="44" y="192" width="250" height="40" rx="8" fill="#1d2128" stroke="#1d2128" stroke-width="1"/><text x="58" y="210" font-size="13" fill="#e8eaed" font-weight="700" text-anchor="start">Admin</text><text x="58" y="225" font-size="11" fill="#9aa1ab" font-weight="400" text-anchor="start">built in · everything</text><rect x="44" y="238" width="250" height="40" rx="8" fill="#1d2128" stroke="#1d2128" stroke-width="1"/><text x="58" y="256" font-size="13" fill="#e8eaed" font-weight="700" text-anchor="start">Maintainer</text><text x="58" y="271" font-size="11" fill="#9aa1ab" font-weight="400" text-anchor="start">built in</text><rect x="44" y="284" width="250" height="40" rx="8" fill="#1d2128" stroke="#1d2128" stroke-width="1"/><text x="58" y="302" font-size="13" fill="#e8eaed" font-weight="700" text-anchor="start">Driver</text><text x="58" y="317" font-size="11" fill="#9aa1ab" font-weight="400" text-anchor="start">built in</text><rect x="44" y="330" width="250" height="40" rx="8" fill="#1d2128" stroke="#1d2128" stroke-width="1"/><text x="58" y="348" font-size="13" fill="#e8eaed" font-weight="700" text-anchor="start">Viewer</text><text x="58" y="363" font-size="11" fill="#9aa1ab" font-weight="400" text-anchor="start">built in</text><rect x="44" y="376" width="250" height="40" rx="8" fill="#24406a" stroke="#24406a" stroke-width="1"/><text x="58" y="394" font-size="13" fill="#e8eaed" font-weight="700" text-anchor="start">Chauffeur</text><text x="58" y="409" font-size="11" fill="#9aa1ab" font-weight="400" text-anchor="start">2 people</text><rect x="44" y="422" width="250" height="40" rx="8" fill="#1d2128" stroke="#1d2128" stroke-width="1"/><text x="58" y="440" font-size="13" fill="#e8eaed" font-weight="700" text-anchor="start">Apprentice</text><text x="58" y="455" font-size="11" fill="#9aa1ab" font-weight="400" text-anchor="start">1 person</text><rect x="44" y="472" width="130" height="30" rx="15" fill="#2f6fde" stroke="#2f6fde" stroke-width="1"/><text x="109.0" y="492" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle">+ Add role</text><text x="44" y="524" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">The built-in roles stay as they are;</text><text x="44" y="540" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">Admin always has everything.</text><text x="330" y="204" font-size="11.5" fill="#9aa1ab" font-weight="600" text-anchor="start">Name</text><rect x="330" y="210" width="300" height="30" rx="6" fill="#101318" stroke="#3a4a5c" stroke-width="1"/><text x="340" y="230" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">Chauffeur</text><text x="330" y="268" font-size="11" fill="#79b8ff" font-weight="700" text-anchor="start">DRIVER LEVEL (IN DRIVER MODE AND UP)</text><rect x="330" y="281" width="14" height="14" rx="3" fill="#2f6fde" stroke="#3a4a5c" stroke-width="1"/><text x="333" y="293" font-size="11" fill="#ffffff" font-weight="700" text-anchor="start">✓</text><text x="352" y="292" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">See the vehicle and its history (always)</text><rect x="330" y="303" width="14" height="14" rx="3" fill="#2f6fde" stroke="#3a4a5c" stroke-width="1"/><text x="333" y="315" font-size="11" fill="#ffffff" font-weight="700" text-anchor="start">✓</text><text x="352" y="314" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">Log fuel-ups</text><rect x="330" y="325" width="14" height="14" rx="3" fill="#2f6fde" stroke="#3a4a5c" stroke-width="1"/><text x="333" y="337" font-size="11" fill="#ffffff" font-weight="700" text-anchor="start">✓</text><text x="352" y="336" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">Log readings</text><rect x="330" y="347" width="14" height="14" rx="3" fill="#101318" stroke="#3a4a5c" stroke-width="1"/><text x="352" y="358" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">Open squawks</text><text x="330" y="398" font-size="11" fill="#79b8ff" font-weight="700" text-anchor="start">MAINTAINER LEVEL (IN MAINTAINER MODE)</text><rect x="330" y="411" width="14" height="14" rx="3" fill="#101318" stroke="#3a4a5c" stroke-width="1"/><text x="352" y="422" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">Log maintenance and repairs</text><rect x="330" y="433" width="14" height="14" rx="3" fill="#101318" stroke="#3a4a5c" stroke-width="1"/><text x="352" y="444" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">Sign off or defer squawks</text><rect x="330" y="455" width="14" height="14" rx="3" fill="#101318" stroke="#3a4a5c" stroke-width="1"/><text x="352" y="466" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">Change the schedule and setup (also shops and rates)</text><rect x="330" y="477" width="14" height="14" rx="3" fill="#101318" stroke="#3a4a5c" stroke-width="1"/><text x="352" y="488" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">Change others&#x27; records</text><rect x="660" y="411" width="14" height="14" rx="3" fill="#101318" stroke="#3a4a5c" stroke-width="1"/><text x="682" y="422" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">Keep a photo&#x27;s original</text><rect x="660" y="433" width="14" height="14" rx="3" fill="#101318" stroke="#3a4a5c" stroke-width="1"/><text x="682" y="444" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">Documents and plates</text><rect x="660" y="455" width="14" height="14" rx="3" fill="#101318" stroke="#3a4a5c" stroke-width="1"/><text x="682" y="466" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">Send out for service</text><text x="330" y="520" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">Held by 2 people. A Chauffeur picks only Driver mode; an Apprentice (maintenance ticked) gets Driver and Maintainer.</text><rect x="330" y="534" width="90" height="30" rx="15" fill="#2f6fde" stroke="#2f6fde" stroke-width="1"/><text x="375.0" y="554" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle">Save</text><rect x="434" y="534" width="120" height="30" rx="15" fill="#5a1f24" stroke="#5a1f24" stroke-width="1"/><text x="494.0" y="554" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle">Delete role</text><text x="570" y="554" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">Its grants go with it; Users shows who lost it.</text><rect x="24" y="588" width="952" height="74" rx="12" fill="#14171c" stroke="#14171c" stroke-width="1"/><text x="44" y="614" font-size="11" fill="#79b8ff" font-weight="700" text-anchor="start">B · ONE GRID: ROLES ACROSS, PERMISSIONS DOWN</text><text x="44" y="638" font-size="12.5" fill="#c3c8cf" font-weight="400" text-anchor="start">Every role side by side with ticks in a table. Easy to compare, but cramped on a phone, and the built-in columns would look editable.</text><text x="24" y="692" font-size="17" fill="#1b1f24" font-weight="700" text-anchor="start">2 · A person&#x27;s roles, name, and username (Users, Admin mode; Settings → You)</text><text x="24" y="712" font-size="12.5" fill="#5b6470" font-weight="400" text-anchor="start">+ Add role lists the built-in roles, then the household&#x27;s. Names change here; the person&#x27;s own Settings → You only when the household allows it.</text><rect x="24" y="728" width="952" height="250" rx="12" fill="#14171c" stroke="#14171c" stroke-width="1"/><text x="44" y="756" font-size="11" fill="#79b8ff" font-weight="700" text-anchor="start">USERS → SAM</text><text x="44" y="776" font-size="11.5" fill="#9aa1ab" font-weight="600" text-anchor="start">Display name</text><rect x="44" y="782" width="260" height="30" rx="6" fill="#101318" stroke="#3a4a5c" stroke-width="1"/><text x="54" y="802" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">Sam</text><text x="320" y="776" font-size="11.5" fill="#9aa1ab" font-weight="600" text-anchor="start">Username</text><rect x="320" y="782" width="200" height="30" rx="6" fill="#101318" stroke="#3a4a5c" stroke-width="1"/><text x="330" y="802" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">sam</text><text x="44" y="838" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">A new username works from Sam&#x27;s next sign-in; signed-in devices stay signed in.</text><text x="44" y="868" font-size="11" fill="#79b8ff" font-weight="700" text-anchor="start">ROLES</text><rect x="44" y="878" width="470" height="34" rx="8" fill="#1d2128" stroke="#1d2128" stroke-width="1"/><text x="58" y="900" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">Chauffeur ▾   on   All vehicles</text><text x="500" y="900" font-size="13" fill="#9aa1ab" font-weight="700" text-anchor="end">✕</text><rect x="44" y="918" width="470" height="34" rx="8" fill="#1d2128" stroke="#1d2128" stroke-width="1"/><text x="58" y="940" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">Driver ▾   on   Group: Home</text><text x="500" y="940" font-size="13" fill="#9aa1ab" font-weight="700" text-anchor="end">✕</text><text x="560" y="756" font-size="11" fill="#79b8ff" font-weight="700" text-anchor="start">SETTINGS → HOUSEHOLD</text><rect x="560" y="773" width="14" height="14" rx="3" fill="#101318" stroke="#3a4a5c" stroke-width="1"/><text x="582" y="784" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">People may change their own name and username</text><text x="582" y="802" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">Off: only the Admin changes them.</text><text x="560" y="838" font-size="11" fill="#79b8ff" font-weight="700" text-anchor="start">SETTINGS → YOU (WHEN ALLOWED)</text><text x="560" y="856" font-size="11.5" fill="#9aa1ab" font-weight="600" text-anchor="start">Display name</text><rect x="560" y="862" width="190" height="30" rx="6" fill="#101318" stroke="#3a4a5c" stroke-width="1"/><text x="570" y="882" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">Sam</text><text x="764" y="856" font-size="11.5" fill="#9aa1ab" font-weight="600" text-anchor="start">Username</text><rect x="764" y="862" width="190" height="30" rx="6" fill="#101318" stroke="#3a4a5c" stroke-width="1"/><text x="774" y="882" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">sam</text><text x="560" y="914" font-size="11.5" fill="#9aa1ab" font-weight="600" text-anchor="start">Email (optional, for password reset)</text><rect x="560" y="920" width="394" height="30" rx="6" fill="#101318" stroke="#3a4a5c" stroke-width="1"/><text x="570" y="940" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">sam@example.com</text><text x="24" y="1008" font-size="17" fill="#1b1f24" font-weight="700" text-anchor="start">3 · Entering Admin mode with a PIN</text><text x="24" y="1028" font-size="12.5" fill="#5b6470" font-weight="400" text-anchor="start">Each Admin chooses, on Settings → You → Admin mode: the password (the default) or a PIN of 6 to 12 digits.</text><rect x="24" y="1044" width="952" height="190" rx="12" fill="#14171c" stroke="#14171c" stroke-width="1"/><text x="44" y="1072" font-size="11" fill="#79b8ff" font-weight="700" text-anchor="start">SETTINGS → YOU</text><text x="44" y="1098" font-size="12.5" fill="#e8eaed" font-weight="600" text-anchor="start">Admin mode asks for</text><rect x="44" y="1108" width="220" height="32" rx="16" fill="#101318" stroke="#3a4a5c" stroke-width="1"/><rect x="46" y="1110" width="108" height="28" rx="14" fill="#2f6fde" stroke="#2f6fde" stroke-width="1"/><text x="100" y="1129" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle">A PIN</text><text x="208" y="1129" font-size="12.5" fill="#9aa1ab" font-weight="600" text-anchor="middle">My password</text><text x="44" y="1160" font-size="11.5" fill="#9aa1ab" font-weight="600" text-anchor="start">New PIN (6–12 digits)</text><rect x="44" y="1166" width="220" height="30" rx="6" fill="#101318" stroke="#3a4a5c" stroke-width="1"/><text x="54" y="1186" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">••••••</text><text x="560" y="1072" font-size="11" fill="#79b8ff" font-weight="700" text-anchor="start">SWITCHING TO ADMIN MODE</text><rect x="560" y="1084" width="394" height="136" rx="10" fill="#1d2128" stroke="#1d2128" stroke-width="1"/><text x="580" y="1110" font-size="15" fill="#e8eaed" font-weight="700" text-anchor="start">Enter Admin mode</text><text x="580" y="1128" font-size="11.5" fill="#9aa1ab" font-weight="600" text-anchor="start">Your PIN</text><rect x="580" y="1134" width="200" height="30" rx="6" fill="#101318" stroke="#3a4a5c" stroke-width="1"/><text x="590" y="1154" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">••••••</text><rect x="800" y="1168" width="130" height="30" rx="15" fill="#2f6fde" stroke="#2f6fde" stroke-width="1"/><text x="865.0" y="1188" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle">Enter</text><text x="580" y="1204" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">Wrong PINs count toward the sign-in lockout.</text><text x="24" y="1264" font-size="17" fill="#1b1f24" font-weight="700" text-anchor="start">4 · Email: set up in .env, checked in the app, and Forgot password?</text><text x="24" y="1284" font-size="12.5" fill="#5b6470" font-weight="400" text-anchor="start">The Admin sees whether email is set up (never the password) and can send a test. Without it, the app works as now.</text><rect x="24" y="1300" width="952" height="250" rx="12" fill="#14171c" stroke="#14171c" stroke-width="1"/><text x="44" y="1328" font-size="11" fill="#79b8ff" font-weight="700" text-anchor="start">SETTINGS → HOUSEHOLD → EMAIL (ADMIN)</text><text x="44" y="1354" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">✓ Set up: smtp.gmail.com:587 (STARTTLS), from Vehicle Manager</text><text x="44" y="1374" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">Links go to https://nas.example.ts.net (VEHICLEMANAGER_BASE_URL)</text><rect x="44" y="1390" width="150" height="30" rx="15" fill="#2f6fde" stroke="#2f6fde" stroke-width="1"/><text x="119.0" y="1410" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle">Send test email</text><text x="208" y="1410" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">Sent to your address</text><text x="44" y="1450" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">Not set up: &quot;Email is off. To turn it on, set VEHICLEMANAGER_SMTP_*</text><text x="44" y="1468" font-size="12.5" fill="#9aa1ab" font-weight="400" text-anchor="start">in .env, the password in a file, then restart (docs/deploying-nas.md).&quot;</text><text x="560" y="1328" font-size="11" fill="#79b8ff" font-weight="700" text-anchor="start">THE SIGN-IN CARD</text><rect x="560" y="1340" width="394" height="196" rx="10" fill="#1d2128" stroke="#1d2128" stroke-width="1"/><text x="580" y="1366" font-size="15" fill="#e8eaed" font-weight="700" text-anchor="start">Forgot password?</text><text x="580" y="1382" font-size="11.5" fill="#9aa1ab" font-weight="600" text-anchor="start">Username or email</text><rect x="580" y="1388" width="354" height="30" rx="6" fill="#101318" stroke="#3a4a5c" stroke-width="1"/><text x="590" y="1408" font-size="12.5" fill="#e8eaed" font-weight="400" text-anchor="start">sam</text><rect x="580" y="1428" width="150" height="30" rx="15" fill="#2f6fde" stroke="#2f6fde" stroke-width="1"/><text x="655.0" y="1448" font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle">Send reset link</text><text x="580" y="1480" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">&quot;If that account has an email address, a link is on its way.</text><text x="580" y="1496" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">It works once, for 30 minutes.&quot; (the same for everyone)</text><text x="580" y="1522" font-size="11.5" fill="#9aa1ab" font-weight="400" text-anchor="start">Shown only when email is set up.</text></svg>