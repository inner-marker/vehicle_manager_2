# Shared CI setup: install the toolchain pinned in rust-toolchain.toml and restore the build cache.
# Used by every workflow so the setup is defined once.
name: Set up Rust
description: Install the pinned toolchain from rust-toolchain.toml and restore the cargo cache

inputs:
  cache-key:
    description: Extra key so jobs with different build outputs don't share a cache
    required: false
    default: ""

runs:
  using: composite
  steps:
    # No toolchain action: rustup (preinstalled on GitHub runners) reads rust-toolchain.toml,
    # so CI uses exactly the same compiler, components, and targets as local builds.
    - name: Install pinned toolchain
      shell: bash
      run: |
        rustup toolchain install
        rustc --version
        cargo --version

    - name: Restore cargo cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: ${{ inputs.cache-key }}
