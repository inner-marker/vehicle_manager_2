# Checks that PR titles are Conventional Commits. Feature PRs are squash-merged with the
# PR title as the commit message (decisions.md #017), and git-cliff builds the changelog from it.
name: PR title

on:
  # pull_request_target runs in the base repo's context so title edits re-trigger it.
  # Safe here: this workflow never checks out or runs code from the PR.
  pull_request_target:
    types: [opened, reopened, edited, synchronize]
    branches: [dev, main]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with the type list in AGENTS.md §8a.
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            ci
            build
            perf
