# Builds the server Docker image (linux/amd64, decisions.md #025) and optionally
# pushes it to GHCR. Reusable: called by the dev-image, release, and main-gate
# workflows, so the build is defined once.
name: Server image (reusable)

on:
  workflow_call:
    inputs:
      push:
        description: Push the image to GHCR (false = build only, as a check)
        type: boolean
        required: true
      tags:
        description: docker/metadata-action tag rules, one per line
        type: string
        required: true

# No permissions are requested here: a reusable workflow inherits its caller's, and
# may not ask for more. Callers that push grant `packages: write`; the main gate's
# build-only check grants nothing extra, so it can't push even by mistake.

jobs:
  image:
    name: Build${{ inputs.push && ' and push' || '' }} server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags plus OCI labels (including org.opencontainers.image.source, which links
      # the package to this repository).
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: ${{ inputs.tags }}

      # The GitHub Actions cache keeps the dx CLI layer and Rust build cache between
      # runs, so only changed layers rebuild.
      - name: Build${{ inputs.push && ' and push' || '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
