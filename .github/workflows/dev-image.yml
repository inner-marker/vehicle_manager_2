# Development images for the NAS (docs/deploying-nas.md). Builds when code, the
# Dockerfile, or the deploy files change on `dev` or a milestone branch, and on demand
# ("Run workflow", which GitHub offers only once this file is on the default branch, `dev`).
# Publishes ghcr.io/inner-marker/vehicle_manager_2 with:
#   :dev                         newest build of `dev`: what the household's main server runs
#                                (decision #062), so it's built WITHOUT test timers
#   :milestone-<phase>-<m>-...   newest build of a milestone branch, for the test server
#                                before its PR (e.g. :milestone-p1-m3-nas-web), WITH test
#                                timers (#054)
#   :sha-<commit>                this exact build (pin or roll back)
name: Server image

on:
  push:
    branches: [dev, "milestone/**"]
    # Docs-only pushes don't change the image, and a build takes several minutes.
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - ".github/workflows/dev-image.yml"
      - ".github/workflows/server-image.yml"
  workflow_dispatch:

# A newer push replaces an image build still in progress for the same branch.
concurrency:
  group: dev-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `dev`: the main server's image, so no test timers (#062).
  publish-dev:
    name: Publish dev image
    if: github.ref_name == 'dev'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/server-image.yml
    with:
      push: true
      test-timers: false
      tags: |
        type=ref,event=branch
        type=sha,prefix=sha-,format=short

  # A milestone branch: the test server's image. Test timers are built in, and switched on
  # only by VEHICLEMANAGER_TEST_MINUTES (#054).
  publish-milestone:
    name: Publish milestone image
    if: github.ref_name != 'dev'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/server-image.yml
    with:
      push: true
      test-timers: true
      # The branch name as a tag ("/" becomes "-"): the milestone's name; plus the commit.
      tags: |
        type=ref,event=branch
        type=sha,prefix=sha-,format=short
